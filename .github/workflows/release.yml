name: release

# Pushing a tag vX.Y.Z runs the lint and test jobs of test.yml, builds the
# package and checks it. Only when all of these pass is the package published
# to PyPI and a GitHub release created. The napari hub lists plugins from PyPI
# (classifier "Framework :: napari"), so a PyPI release also updates the hub
# entry.
#
# One-time setup on PyPI: add a "trusted publisher" for this repository with
# workflow file "release.yml" and environment "pypi" (no API token needed).
# One-time setup on Zenodo: switch this repository on under Zenodo > GitHub
# before the first tag is pushed. Zenodo then archives every published release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  tests:
    # ruff, manifest validation and the full test matrix (same jobs as for pushes and pull requests)
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches package, citation, docs and README pins
        run: |
          python - <<'PY'
          import configparser
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")

          cfg = configparser.ConfigParser()
          cfg.read("setup.cfg")
          setup_ver = cfg["metadata"]["version"].strip()
          if setup_ver != expected:
              raise SystemExit(f"Tag {tag} does not match setup.cfg version {setup_ver}")

          cff = Path("CITATION.cff").read_text(encoding="utf-8")
          m_cff = re.search(r"^version:\s*(\S+)\s*$", cff, re.M)
          if not m_cff or m_cff.group(1) != expected:
              raise SystemExit(
                  f"Tag {tag} does not match CITATION.cff version {m_cff.group(1) if m_cff else None}"
              )

          conf = Path("docs/conf.py").read_text(encoding="utf-8")
          m_conf = re.search(r"^release\s*=\s*['\"]([^'\"]+)['\"]\s*$", conf, re.M)
          if not m_conf or m_conf.group(1) != expected:
              raise SystemExit(
                  f"Tag {tag} does not match docs/conf.py release {m_conf.group(1) if m_conf else None}"
              )

          readme = Path("README.md").read_text(encoding="utf-8")
          pins = re.findall(
              r"(?:https://raw\.githubusercontent\.com/N-Friederich/napari-turbobox"
              r"|https://github\.com/N-Friederich/napari-turbobox/(?:blob|tree))/(v\d+\.\d+\.\d+)/",
              readme,
          )
          if len(pins) < 15:
              raise SystemExit(f"Expected at least 15 tag-pinned links in README.md, found {len(pins)}")
          bad = sorted({p for p in pins if p != tag})
          if bad:
              raise SystemExit(f"README.md tag-pinned links do not match {tag}: {bad}")

          changelog = Path("docs/changelog.rst").read_text(encoding="utf-8")
          m_log = re.search(r"^v(\d+\.\d+\.\d+) \((\d{4}-\d{2}-\d{2})\)\s*$", changelog, re.M)
          if not m_log or m_log.group(1) != expected:
              raise SystemExit(
                  f"Tag {tag} does not match the newest dated section of docs/changelog.rst: "
                  f"{m_log.group(0) if m_log else None}"
              )
          m_date = re.search(r"^date-released:\s*(\S+)\s*$", cff, re.M)
          if not m_date or m_date.group(1) != m_log.group(2):
              raise SystemExit(
                  f"CITATION.cff date-released {m_date.group(1) if m_date else None} "
                  f"does not match the changelog date {m_log.group(2)}"
              )
          print(f"Tag {tag} matches setup.cfg, CITATION.cff, docs/conf.py, the changelog and {len(pins)} README links.")
          PY
      - name: No placeholders left in the released files
        run: |
          if grep -n -e '{{TBD' -e 'XXXXXXX' README.md CITATION.cff docs/*.rst; then
            echo "Placeholders left"; exit 1
          fi
          if grep -n '(unreleased)' docs/changelog.rst; then
            echo "Set the release date in docs/changelog.rst"; exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel and validate the plugin manifest
        run: |
          pip install "napari>=0.6.6,<0.11" npe2 dist/*.whl
          npe2 validate napari-turbobox
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [build, tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
