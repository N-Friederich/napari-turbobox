name: release

# Pushing a tag vX.Y.Z runs the lint and test jobs of test.yml, builds the
# package and checks it. Only when all of these pass is the package published
# to PyPI and a GitHub release created. The napari hub lists plugins from PyPI
# (classifier "Framework :: napari"), so a PyPI release also updates the hub
# entry.
#
# One-time setup on PyPI: add a "trusted publisher" for this repository with
# workflow file "release.yml" and environment "pypi" (no API token needed).
# One-time setup on Zenodo: switch this repository on under Zenodo > GitHub
# before the first tag is pushed. Zenodo then archives every published release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  tests:
    # ruff, manifest validation and the full test matrix (same jobs as for pushes and pull requests)
    uses: ./.github/workflows/test.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match setup.cfg version ${version}"; exit 1
          fi
          cff=$(sed -n 's/^version: *//p' CITATION.cff)
          if [ "v${cff}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CITATION.cff version ${cff}"; exit 1
          fi
      - name: No placeholders left in the released files
        run: |
          if grep -n -e '{{TBD' -e 'XXXXXXX' README.md CITATION.cff docs/*.rst; then
            echo "Placeholders left"; exit 1
          fi
          if grep -n '(unreleased)' docs/changelog.rst; then
            echo "Set the release date in docs/changelog.rst"; exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel and validate the plugin manifest
        run: |
          pip install "napari>=0.6.6,<0.10" npe2 dist/*.whl
          npe2 validate napari-turbobox
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [build, tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
