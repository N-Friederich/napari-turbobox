[metadata]
name = napari-turbobox
version = 0.1.0
description = Synchronized multi-viewer 2D/3D bounding-box annotation for napari (>= 0.6.6)
long_description = file: README.md
long_description_content_type = text/markdown
author = Nils Friederich
author_email = nils.friederich@kit.edu
license = Apache-2.0
license_files =
    LICENSE
    NOTICE
url = https://github.com/N-Friederich/napari-turbobox
project_urls =
    Bug Tracker = https://github.com/N-Friederich/napari-turbobox/issues
    Documentation = https://github.com/N-Friederich/napari-turbobox#readme
    Tutorials = https://github.com/N-Friederich/napari-turbobox/tree/main/tutorials
    Source Code = https://github.com/N-Friederich/napari-turbobox
platforms = any
keywords = napari, plugin, bounding-box, annotation, microscopy, volumetric, 3D, COCO, YOLO
classifiers =
    Development Status :: 3 - Alpha
    Framework :: napari
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Image Processing
    Topic :: Scientific/Engineering :: Visualization

[options]
package_dir =
    = src
packages = find:
# A Qt binding (PyQt5, PyQt6 or PySide6) is not pulled in by napari itself;
# install napari with a Qt extra first, e.g. pip install "napari[all]>=0.6.6".
install_requires =
    napari>=0.6.6,<0.10
    numpy
    qtpy
python_requires = >=3.10
include_package_data = True

[options.extras_require]
# pip install "napari-turbobox[all]" also installs napari with a Qt binding
all =
    napari[all]>=0.6.6,<0.10
testing =
    pytest>=7.0.0
    pytest-qt>=4.2.0
    hypothesis>=6.0.0
# Jupyter tutorials in tutorials/ (JupyterLab and the readers the notebooks use)
tutorials =
    jupyterlab
    h5py
    tifffile
    scikit-image
    scipy
    imageio
# benchmark harness and figures in paper_benchmarks/ (napari-bbox is the baseline)
benchmark =
    napari-bbox==0.1.1
    pandas
    matplotlib
    scipy
dev =
    %(testing)s
    pytest-cov>=4.0.0
    ruff>=0.4.0
    npe2
    build
    twine

[options.packages.find]
where = src

[options.package_data]
napari_turbobox = napari.yaml

[options.entry_points]
napari.manifest =
    napari-turbobox = napari_turbobox:napari.yaml
